; Pins Qt Quick Controls to the Basic style.
;
; blockstitch's Bw* controls restyle their own background and contentItem, which
; the native Windows style refuses - it logs a warning per control and draws the
; system look instead of the canvas's dark theme. Basic is the style those
; components were written against.
;
; This has to be a resource rather than QT_QUICK_CONTROLS_STYLE: with Qt linked
; statically, the Controls plugin resolves its style from a static initializer,
; which runs before main has a chance to set an environment variable.
[Controls]
Style=Basic
