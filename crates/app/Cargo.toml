[package]
name = "stitchcraft-app"
description = "The Stitchcraft editor: a Qt 6/QML block canvas that exports a Minecraft mod."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[[bin]]
name = "stitchcraft"
path = "src/main.rs"

[dependencies]
blockstitch-core.workspace = true
blockstitch-qml.workspace = true
stitchcraft-blocks.workspace = true
stitchcraft-export.workspace = true
serde.workspace = true
serde_json.workspace = true
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"] }
cxx = "1.0"

[build-dependencies]
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }
# Puts the app icon and version info into stitchcraft.exe on Windows; a no-op elsewhere.
embed-resource = "3"
