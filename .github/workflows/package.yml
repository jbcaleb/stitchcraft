# Builds every distributable: the Windows installer (+ portable zip + MSIX), the
# macOS app bundle and the Linux AppImage. Reusable, so the push-triggered
# build-artifacts.yml and the tag-triggered release.yml share one definition.
name: Package

on:
  workflow_call:
    inputs:
      version:
        description: "Version to stamp on the packages; blank means Cargo.toml's version plus -dev.<sha>"
        type: string
        default: ""
      retention:
        description: "Days to keep the artifacts"
        type: number
        default: 14
      sign_msix_test:
        description: "Sign the MSIX with a throwaway certificate so it can be installed for testing"
        type: boolean
        default: false

env:
  QT_VERSION: 6.10.*

jobs:
  # ARM runners are not available to private repositories: a job asking for one
  # would queue forever. So only ask for them when the repository is public.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      windows: ${{ steps.matrix.outputs.windows }}
      linux: ${{ steps.matrix.outputs.linux }}
    steps:
      - id: matrix
        env:
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          win='{"name":"windows-x86_64","runner":"windows-latest","target":"x86_64-pc-windows-msvc","arch":"x86_64","msix_arch":"x64","qt_arch":"win64_msvc2022_64","qt_host":"","experimental":false}'
          lin='{"name":"linux-x86_64","runner":"ubuntu-latest","arch":"x86_64","qt_arch":"linux_gcc_64","qt_host":"","experimental":false}'
          if [ "$PRIVATE" != "true" ]; then
            win="$win,"'{"name":"windows-arm64","runner":"windows-11-arm","target":"aarch64-pc-windows-msvc","arch":"arm64","msix_arch":"arm64","qt_arch":"win64_msvc2022_arm64","qt_host":"windows_arm64","experimental":true}'
            lin="$lin,"'{"name":"linux-arm64","runner":"ubuntu-24.04-arm","arch":"arm64","qt_arch":"linux_gcc_arm64","qt_host":"linux_arm64","experimental":true}'
          fi
          echo "windows={\"include\":[$win]}" >> "$GITHUB_OUTPUT"
          echo "linux={\"include\":[$lin]}" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows (${{ matrix.name }})
    needs: plan
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.windows) }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.qt_arch }}
          host: ${{ matrix.qt_host }}
          cache: true

      # cxx-qt looks at QMAKE only, not PATH, and otherwise downloads a minimal Qt of
      # its own instead of using the one just installed.
      - name: Point the build at Qt
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value "QMAKE=$env:QT_ROOT_DIR/bin/qmake.exe"

      - name: Work out the version
        id: version
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)-dev.${GITHUB_SHA::7}"
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build installer
        shell: pwsh
        run: ./scripts/build-installer.ps1 -SkipBuild -Version "${{ steps.version.outputs.value }}" -Target ${{ matrix.target }}

      - name: Zip the portable build
        shell: pwsh
        run: Compress-Archive -Path dist/stage/* -DestinationPath dist/stitchcraft-windows-${{ matrix.arch }}-portable.zip

      - name: Build MSIX
        shell: pwsh
        run: ./scripts/build-msix.ps1 -Version "${{ steps.version.outputs.value }}" -Target ${{ matrix.target }} -Arch ${{ matrix.msix_arch }}

      # An unsigned MSIX will not install locally; the test copy is signed with a
      # throwaway certificate.
      - name: Sign MSIX with a test certificate
        if: inputs.sign_msix_test
        shell: pwsh
        run: ./scripts/sign-msix-test.ps1 -Msix dist/stitchcraft-windows-${{ matrix.arch }}.msix

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: stitchcraft-windows-${{ matrix.arch }}-setup.exe
          path: dist/stitchcraft-windows-${{ matrix.arch }}-setup.exe
          if-no-files-found: error
          retention-days: ${{ inputs.retention }}

      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: stitchcraft-windows-${{ matrix.arch }}-portable.zip
          path: dist/stitchcraft-windows-${{ matrix.arch }}-portable.zip
          if-no-files-found: error
          retention-days: ${{ inputs.retention }}

      - name: Upload MSIX
        uses: actions/upload-artifact@v4
        with:
          name: stitchcraft-windows-${{ matrix.arch }}.msix
          path: |
            dist/stitchcraft-windows-${{ matrix.arch }}.msix
            dist/stitchcraft-msix-test.cer
          if-no-files-found: ignore
          retention-days: ${{ inputs.retention }}

  macos:
    name: macOS (arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-apple-darwin

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - name: Point the build at Qt
        run: echo "QMAKE=$QT_ROOT_DIR/bin/qmake" >> "$GITHUB_ENV"

      - name: Build the app bundle
        run: ./scripts/build-macos-bundle.sh aarch64-apple-darwin

      - name: Zip the app bundle
        run: ditto -c -k --sequesterRsrc --keepParent dist/Stitchcraft.app stitchcraft-macos-arm64.app.zip

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: stitchcraft-macos-arm64.app.zip
          path: stitchcraft-macos-arm64.app.zip
          if-no-files-found: error
          retention-days: ${{ inputs.retention }}

  linux:
    name: AppImage (${{ matrix.name }})
    needs: plan
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.linux) }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config curl file \
            libgl1-mesa-dev libglu1-mesa-dev libegl1 libxkbcommon-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libfontconfig1 libdbus-1-3

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.qt_arch }}
          host: ${{ matrix.qt_host }}
          cache: true

      - name: Point the build at Qt
        run: echo "QMAKE=$QT_ROOT_DIR/bin/qmake" >> "$GITHUB_ENV"

      - name: Build the AppImage
        run: ./scripts/build-appimage.sh

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: stitchcraft-linux-${{ matrix.arch }}.AppImage
          path: dist/stitchcraft-linux-${{ matrix.arch }}.AppImage
          if-no-files-found: error
          retention-days: ${{ inputs.retention }}
